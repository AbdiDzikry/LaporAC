<div class="h-screen flex flex-col font-sans bg-gray-50/50">
    <div
        class="px-6 py-6 md:px-8 md:py-8 space-y-6 flex-1 w-full max-w-[1600px] mx-auto overflow-y-auto scrollbar-thin">

        <!-- HEADER -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-2">
            <div>
                <h1 class="text-3xl font-black text-gray-900 tracking-tight">Pengaturan Sistem</h1>
                <p class="text-gray-500 mt-1 font-medium text-sm">Kelola pengguna, konfigurasi aplikasi, dan pantau
                    aktivitas sistem secara terpusat.</p>
            </div>
        </div>

        <!-- MAIN TABS -->
        <div *ngIf="!loading" class="flex gap-4 mb-6 border-b border-gray-200 pb-px overflow-x-auto scrollbar-hide">

            <button *ngIf="hasAccess('/admin/users')" (click)="setTab('users')"
                [class.text-blue-600]="activeTab === 'users'" [class.border-blue-600]="activeTab === 'users'"
                [class.border-transparent]="activeTab !== 'users'" [class.text-gray-500]="activeTab !== 'users'"
                class="px-2 py-3 font-bold text-sm border-b-2 transition-all hover:text-blue-600 flex items-center gap-2 whitespace-nowrap">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="currentColor"
                    stroke-width="2">
                    <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2" />
                    <circle cx="9" cy="7" r="4" />
                    <path d="M23 21v-2a4 4 0 00-3-3.87" />
                    <path d="M16 3.13a4 4 0 010 7.75" />
                </svg>
                Manajemen User & Role
            </button>

            <button *ngIf="hasAccess('/admin/configs')" (click)="setTab('configs')"
                [class.text-blue-600]="activeTab === 'configs'" [class.border-blue-600]="activeTab === 'configs'"
                [class.border-transparent]="activeTab !== 'configs'" [class.text-gray-500]="activeTab !== 'configs'"
                class="px-2 py-3 font-bold text-sm border-b-2 transition-all hover:text-blue-600 flex items-center gap-2 whitespace-nowrap">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="currentColor"
                    stroke-width="2">
                    <circle cx="12" cy="12" r="3" />
                    <path
                        d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06a1.65 1.65 0 001.82.33h.09a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82v.09a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z" />
                </svg>
                App Configs
            </button>

            <button *ngIf="hasAccess('/admin/logs')" (click)="setTab('logs')"
                [class.text-blue-600]="activeTab === 'logs'" [class.border-blue-600]="activeTab === 'logs'"
                [class.border-transparent]="activeTab !== 'logs'" [class.text-gray-500]="activeTab !== 'logs'"
                class="px-2 py-3 font-bold text-sm border-b-2 transition-all hover:text-blue-600 flex items-center gap-2 whitespace-nowrap">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="currentColor"
                    stroke-width="2">
                    <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" />
                </svg>
                System Audit & Logs
            </button>

        </div>

        <div *ngIf="loading" class="flex justify-center py-12">
            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
        </div>

        <!-- CONTENT AREA -->
        <div *ngIf="!loading" class="mt-4 animate-fade-in relative z-10 w-full min-h-[500px]">
            <!-- Child components are embedded here. They should not have their own outer headers/padding -->
            <app-user-list *ngIf="activeTab === 'users'"></app-user-list>
            <app-configs *ngIf="activeTab === 'configs'"></app-configs>
            <app-logs *ngIf="activeTab === 'logs'"></app-logs>
        </div>
    </div>

    <!-- Decorative bg -->
    <div class="fixed right-0 top-0 w-96 h-96 bg-blue-50 rounded-full blur-3xl opacity-50 -z-10 pointer-events-none">
    </div>
</div>
