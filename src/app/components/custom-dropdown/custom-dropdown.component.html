<div class="relative w-full">
    <!-- Label -->
    <label *ngIf="label" class="text-xs font-bold text-gray-700 mb-2 block uppercase tracking-wide">
        {{ label }}
    </label>

    <!-- Dropdown Button -->
    <button type="button" (click)="toggleDropdown()"
        class="w-full bg-white border border-gray-300 rounded-lg px-4 py-2.5 text-left text-sm font-medium text-gray-700 hover:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all flex items-center justify-between shadow-sm"
        [class.ring-2]="isOpen" [class.ring-blue-500]="isOpen" [class.border-blue-500]="isOpen">

        <span class="block truncate mr-6" [class.text-gray-400]="!value && value !== 0">
            {{ selectedLabel }}
        </span>

        <svg class="h-4 w-4 text-gray-400 transform transition-transform duration-200 flex-shrink-0"
            [class.rotate-180]="isOpen" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"
            aria-hidden="true">
            <path fill-rule="evenodd"
                d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"
                clip-rule="evenodd" />
        </svg>
    </button>

    <!-- Dropdown Menu -->
    <div *ngIf="isOpen"
        class="absolute z-50 mt-1 w-full bg-white shadow-xl max-h-60 rounded-lg py-1 text-base ring-1 ring-black ring-opacity-5 overflow-auto focus:outline-none sm:text-sm animate-in fade-in zoom-in-95 duration-100 origin-top">

        <div *ngFor="let option of options" (click)="selectOption(option)"
            class="cursor-pointer select-none relative py-2.5 pl-3 pr-9 hover:bg-blue-50 transition-colors"
            [class.bg-blue-50]="option.value === value" [class.text-blue-700]="option.value === value"
            [class.font-semibold]="option.value === value" [class.text-gray-900]="option.value !== value">

            <span class="block truncate">
                {{ option.label }}
            </span>

            <span *ngIf="option.value === value"
                class="absolute inset-y-0 right-0 flex items-center pr-4 text-blue-600">
                <svg class="h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"
                    aria-hidden="true">
                    <path fill-rule="evenodd"
                        d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"
                        clip-rule="evenodd" />
                </svg>
            </span>
        </div>

        <div *ngIf="options.length === 0" class="py-2.5 px-3 text-gray-500 italic text-center text-sm">
            No options available
        </div>
    </div>
</div>
